# RabbitMQ (ADR-011): exchange topic `workshop` + DLX `workshop.dlx` são
# declarados pelos próprios serviços ao conectar (RabbitMqConnectionFactory).
# Credenciais no Secret `rabbitmq-credentials` (scripts/bootstrap-secrets.sh);
# nunca commitadas. Management UI: kubectl -n platform port-forward svc/rabbitmq 15672
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: platform
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: platform
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: platform
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          env:
            # Nodename fixo: o RabbitMQ guarda os dados por nodename. Nó único →
            # rabbit@localhost é estável e sempre resolve (rabbit@<hostname>
            # falhou com epmd_error porque o hostname do Pod não resolvia).
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: rabbitmq-credentials, key: RABBITMQ_PASSWORD }
          ports:
            - containerPort: 5672
            - containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
